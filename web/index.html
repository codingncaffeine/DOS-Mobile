<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#101418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>DOS Mobile</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header id="bar">
    <span id="brand">DOS Mobile</span>
    <span id="status">starting…</span>
    <span id="spacer"></span>
    <button id="btn-keyboard" title="Show keyboard">⌨</button>
    <button id="btn-cad" title="Ctrl+Alt+Del">⟲</button>
    <button id="btn-menu" title="Menu">☰</button>
  </header>
  <main id="screen-wrap">
    <canvas id="screen" width="720" height="400"></canvas>
    <div id="overlay"><div id="overlay-text">Loading…</div></div>
    <input id="kbd-proxy" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="keyboard input">
  </main>
  <section id="oskbd" hidden>
    <div class="osk-row">
      <button data-code="Escape">Esc</button><button data-code="F1">F1</button><button data-code="F2">F2</button><button data-code="F3">F3</button><button data-code="F4">F4</button><button data-code="F5">F5</button><button data-code="F6">F6</button><button data-code="F7">F7</button><button data-code="F8">F8</button><button data-code="F9">F9</button><button data-code="F10">F10</button><button data-code="F11">F11</button><button data-code="F12">F12</button>
    </div>
    <div class="osk-row">
      <button data-code="Tab">Tab</button><button data-code="ControlLeft" data-sticky>Ctrl</button><button data-code="AltLeft" data-sticky>Alt</button><button data-code="ShiftLeft" data-sticky>Shift</button><button data-code="ArrowLeft">←</button><button data-code="ArrowUp">↑</button><button data-code="ArrowDown">↓</button><button data-code="ArrowRight">→</button><button data-code="Home">Home</button><button data-code="End">End</button><button data-code="PageUp">PgUp</button><button data-code="PageDown">PgDn</button><button data-code="Insert">Ins</button><button data-code="Delete">Del</button><button data-code="Backspace">⌫</button><button data-code="Enter">Enter</button><button data-code="Space" class="wide">Space</button><button id="osk-text">abc</button>
    </div>
  </section>
  <section id="menu" hidden>
    <div class="menu-row"><label>Speed <span id="speed-label">66 MHz</span></label>
      <input id="speed" type="range" min="1" max="300" value="66"></div>
    <div class="menu-row">
      <button id="btn-reset">Reboot</button>
      <button id="btn-add">Add programs…</button>
      <button id="btn-add-folder">Add folder…</button>
      <button id="btn-floppy">Insert floppy image…</button>
      <button id="btn-export">Export drive C:</button>
      <button id="btn-wipe">Wipe drive C:</button>
      <button id="btn-fullscreen">Fullscreen</button>
    </div>
    <div class="menu-row small">Drop a ZIP, files or a folder on the screen to copy them to C:\GAMES; drop a floppy image (.img/.ima) to insert it into A:.</div>
    <pre id="log"></pre>
  </section>
  <input id="file-floppy" type="file" accept=".img,.ima,.dsk,.vfd" hidden>
  <input id="file-add" type="file" multiple hidden>
  <input id="file-add-folder" type="file" webkitdirectory hidden>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
